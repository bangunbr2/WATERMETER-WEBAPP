<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Tagihan Air Bumirejo II</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Hubungkan Manifest PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">    
    <style>
        /* Pengaturan default ukuran halaman A4 */
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        /* Styling khusus saat mode print browser diaktifkan */
        @media print {
            body * {
                visibility: hidden !important;
            }
            
            /* Jika mode thermal printer aktif */
            body.print-thermal {
                width: 58mm; 
                margin: 0;
            }
            body.print-thermal @page {
                size: 58mm auto;
                margin: 0mm;
            }
            body.print-thermal #area-preview-invoice, 
            body.print-thermal #area-preview-invoice * {
                visibility: visible !important;
            }
            body.print-thermal #area-preview-invoice {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 58mm !important;
                max-width: 58mm !important;
                margin: 0 !important;
                padding: 2mm !important;
                border: none !important;
                box-shadow: none !important;
                font-size: 10px !important;
            }

            /* Tampilkan area invoice standar / A4 */
            #area-preview-invoice, #area-preview-invoice * {
                visibility: visible !important;
            }
            #area-preview-invoice {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
            }

            /* Tampilkan area laporan */
            #area-preview-laporan, #area-preview-laporan * {
                visibility: visible !important;
            }
            #area-preview-laporan {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
            }
        }
    </style>
</head>

            <button onclick="document.getElementById('banner-notif').classList.add('hidden')">✕</button>
